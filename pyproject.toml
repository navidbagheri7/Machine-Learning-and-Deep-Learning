[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-generalization-lab"
version = "1.3.0"
description = "From probabilistic foundations to evaluated machine learning systems"
authors = [{name = "Navid Bagheri-Shouraki"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3", "scikit-learn>=1.4,<1.7", "matplotlib>=3.8,<4", "joblib>=1.3", "threadpoolctl>=3"]

[project.optional-dependencies]
deep = ["torch>=2.4,<3", "torchvision>=0.19,<1"]
pretrained = ["huggingface-hub>=0.27,<2", "opencv-python>=4.7,<5", "pyyaml>=6", "scikit-image>=0.21,<1"]
restoration = ["lpips>=0.1.4,<0.2", "timm>=1.0,<2", "einops>=0.7,<1", "gdown>=5,<7", "libarchive-c>=5,<6", "scikit-image>=0.24,<1", "PyWavelets>=1.8,<2"]
boosting = ["catboost>=1.2.8,<2"]
notebooks = ["jupyterlab>=4,<5", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]
dev = ["pytest>=7", "ruff>=0.6", "build>=1"]

[project.scripts]
learning-lab = "learning_lab.cli:main"

[project.urls]
Repository = "https://github.com/navidbagheri7/Machine-Learning-and-Deep-Learning"
Documentation = "https://github.com/navidbagheri7/Machine-Learning-and-Deep-Learning#readme"
Demo = "https://navidbagheri7.github.io/Machine-Learning-and-Deep-Learning/"
Issues = "https://github.com/navidbagheri7/Machine-Learning-and-Deep-Learning/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
learning_lab = ["resources/*.json", "resources/configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = ["legacy", ".local", "results", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_deep.py" = ["E402"]
